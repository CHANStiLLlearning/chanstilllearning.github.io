    - generic [ref=f2e209]:
      - heading "How Does Compound Interest Work?" [level=2] [ref=f2e210]
      - paragraph [ref=f2e211]: Compound interest is the interest you earn on both your original money and on the interest you accumulate over time. Often dubbed the "eighth wonder of the world," compounding allows an investment portfolio to grow exponentially rather than linearly.
      - heading "The Compound Interest Formula" [level=3] [ref=f2e212]
      - paragraph [ref=f2e213]: "The standard mathematical equation used to calculate future value with compounding is:"
      - generic [ref=f2e214]:
        - strong [ref=f2e215]: "Formula:"
        - code [ref=f2e216]: A = P (1 + r/n)^(nt)
        - text: "Where:"
        - list [ref=f2e217]:
          - listitem [ref=f2e218]:
            - strong [ref=f2e219]: A
            - text: = The future value of the investment, including interest.
          - listitem [ref=f2e220]:
            - strong [ref=f2e221]: P
            - text: = The initial principal balance.
          - listitem [ref=f2e222]:
            - strong [ref=f2e223]: r
            - text: = The annual nominal interest rate (as a decimal).
          - listitem [ref=f2e224]:
            - strong [ref=f2e225]: "n"
            - text: = The number of times interest compounds per year.
          - listitem [ref=f2e226]:
            - strong [ref=f2e227]: t
            - text: = The number of years the money is invested.
      - heading "Why Time in the Market Matters Most" [level=3] [ref=f2e228]
      - paragraph [ref=f2e229]:
        - text: The most important variable in the compound interest formula is not the money you start with—it is
        - strong [ref=f2e230]: time (t)
        - text: . Because time is in the exponent, starting to save just 5 or 10 years earlier dramatically increases your total nest egg without requiring you to deposit more cash.
